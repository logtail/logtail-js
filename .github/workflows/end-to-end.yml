name: E2E Tests

on:
  push:
    paths:
      - .github/workflows/end-to-end.yml
      - example-project/**
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x]
        dependencies: [install, update]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: example-project/package-lock.json

      - name: Install dependencies
        run: npm ${{ matrix.dependencies }}
        working-directory: ./example-project

      - name: Run example project with valid token
        env:
          INGESTING_HOST: ${{ secrets.CLOUD_INGESTING_HOST }}
          SOURCE_TOKEN: ${{ secrets.CLOUD_SOURCE_TOKEN }}
        run: node index.js ${{ env.SOURCE_TOKEN }} ${{ env.INGESTING_HOST }}
        working-directory: ./example-project

      - name: Run example project with invalid token
        env:
          INGESTING_HOST: ${{ secrets.CLOUD_INGESTING_HOST }}
        run: |
          if node index.js INVALID_TOKEN ${{ env.INGESTING_HOST }}; then
            echo "This should have failed but didn't"
            exit 1
          else
            echo "Failed successfully"
          fi
        working-directory: ./example-project

  bun:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        bun-version: [latest, 1.0.0]
        dependencies: [install, update]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun ${{ matrix.dependencies }}
        working-directory: ./example-project

      - name: Run example project with valid token
        env:
          INGESTING_HOST: ${{ secrets.CLOUD_INGESTING_HOST }}
          SOURCE_TOKEN: ${{ secrets.CLOUD_SOURCE_TOKEN }}
        run: bun run index.js ${{ env.SOURCE_TOKEN }} ${{ env.INGESTING_HOST }}
        working-directory: ./example-project

      - name: Run example project with invalid token
        env:
          INGESTING_HOST: ${{ secrets.CLOUD_INGESTING_HOST }}
        run: |
          if bun run index.js INVALID_TOKEN ${{ env.INGESTING_HOST }}; then
            echo "This should have failed but didn't"
            exit 1
          else
            echo "Failed successfully"
          fi
        working-directory: ./example-project

  notify-linear:
    if: ${{ failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule') }}
    needs: [node, bun]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: "Gather failure context"
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILED=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate \
            --jq '[.jobs[]
                    | select(.conclusion == "failure")
                    | "- **\(.name)** — failed at _\([.steps[] | select(.conclusion == "failure") | .name] | join(", "))_"]
                  | join("\n")')

          if [ -z "$FAILED" ]; then
            FAILED="_(no failed jobs reported by the API yet)_"
          fi

          {
            echo "failed_jobs<<CTXEOF"
            echo "$FAILED"
            echo "CTXEOF"
          } >> "$GITHUB_OUTPUT"
      - name: "Create Linear issue"
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          LINEAR_STATUS_ID: ${{ secrets.LINEAR_STATUS_PLAN_ID }}
          LINEAR_PROJECT_ID: ${{ secrets.LINEAR_PROJECT_ID }}
          LINEAR_ASSIGNEE_ID: ${{ secrets.LINEAR_ASSIGNEE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          FAILED_JOBS: ${{ steps.ctx.outputs.failed_jobs }}
        run: |
          SHORT_SHA="${SHA:0:7}"

          # head_commit is only populated on push events; skip the line otherwise
          COMMIT_LINE="**Commit:** \`$SHORT_SHA\`"
          if [ -n "$COMMIT_MESSAGE" ]; then
            COMMIT_SUBJECT="$(printf '%s' "$COMMIT_MESSAGE" | head -n1)"
            COMMIT_LINE="**Commit:** \`$SHORT_SHA\` — $COMMIT_SUBJECT"
          fi

          ATTEMPT_NOTE=""
          if [ "$RUN_ATTEMPT" != "1" ]; then
            ATTEMPT_NOTE=" (attempt #$RUN_ATTEMPT)"
          fi

          TITLE="E2E failure: ${{ github.workflow }} (${{ github.repository }})"
          DESCRIPTION=$(cat <<EOF
          **${{ github.workflow }}** failed on \`${{ github.ref_name }}\` in \`${{ github.repository }}\` via \`$EVENT_NAME\`$ATTEMPT_NOTE

          **Failing jobs:**
          $FAILED_JOBS

          $COMMIT_LINE

          [View failing run]($RUN_URL)
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg query 'mutation IssueCreate($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }' \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg teamId "$LINEAR_TEAM_ID" \
            --arg assigneeId "$LINEAR_ASSIGNEE_ID" \
            --arg stateId "$LINEAR_STATUS_ID" \
            --arg projectId "$LINEAR_PROJECT_ID" \
            '{
              query: $query,
              variables: {
                input: {
                  title: $title,
                  description: $description,
                  teamId: $teamId,
                  assigneeId: $assigneeId,
                  stateId: $stateId,
                  projectId: $projectId,
                  priority: 2
                }
              }
            }')

          curl -sSf -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
